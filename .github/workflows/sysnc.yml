name: Sync Upstream

on:
  schedule:
    - cron: '0 0 * * *'   # 每天 UTC 00:00 = 北京时间 08:00
  workflow_dispatch:       # 可在 Actions 页面手动点一下触发，方便首次测试

permissions:
  contents: write          # 允许把合并结果 push 回你的 fork

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/ripienaar/free-for-dev.git
          git fetch upstream master

      - name: Merge upstream (保留 fork 自有文件)
        run: |
          # -X ours：遇到冲突时以你 fork 自己的版本为准，同步脚本绝不会被上游覆盖
          git merge upstream/master -X ours --no-edit
          # 双重保险：无论如何把本仓库的同步脚本还原成 fork 里的版本
          git checkout HEAD -- .github/workflows/sync.yml || true

      - name: Push to fork
        run: git push origin master
